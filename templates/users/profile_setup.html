{% extends 'base.html' %}

{% block content %}
<main class="auth-page container">
  <section class="auth-card auth-card-wide">
    <div class="auth-intro">
      <span class="auth-icon"><i class="bi bi-person-vcard"></i></span>
      <h1>Complete your profile</h1>
      <p>Tell us about your background. These details will appear on your dashboard.</p>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
      </div>
      {% endfor %}
      <button class="btn btn-primary w-100 auth-submit" type="submit">Save profile and continue <i class="bi bi-arrow-right ms-1"></i></button>
    </form>
  </section>
</main>
{% endblock %}
